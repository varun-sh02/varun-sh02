<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="55%" stop-color="#0A1420"/>
      <stop offset="100%" stop-color="#0B1F2E"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#37F0C2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" values="0;520;520;0;0" keyTimes="0;0.28;0.75;0.82;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#122033" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- floating code particles -->
  <g font-family="ui-monospace, monospace" font-size="22" fill="#1F9C0C" opacity="0.35">
    <text x="80" y="280">&lt;/&gt;</text>
    <animateTransform xlink:href="#p1" attributeName="transform" type="translate" values="0,0; 0,-260" dur="9s" repeatCount="indefinite"/>
  </g>
  <text id="p1" x="80" y="300" font-family="ui-monospace, monospace" font-size="22" fill="#39FF14" opacity="0.3">&lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-320" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.1;0.8;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text id="p2" x="1080" y="300" font-family="ui-monospace, monospace" font-size="26" fill="#00E5FF" opacity="0.3">{ }
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-320" dur="11s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.1;0.8;1" dur="11s" begin="1.5s" repeatCount="indefinite"/>
  </text>
  <text id="p3" x="950" y="300" font-family="ui-monospace, monospace" font-size="18" fill="#7C3AED" opacity="0.3">=&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-320" dur="8s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.1;0.8;1" dur="8s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text id="p4" x="180" y="300" font-family="ui-monospace, monospace" font-size="20" fill="#37F0C2" opacity="0.3">01
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-320" dur="10s" begin="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0.3;0" keyTimes="0;0.1;0.8;1" dur="10s" begin="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- name -->
  <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, 'Fira Code', monospace" font-size="64" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)">VARUN SHAH</text>

  <!-- typed subtitle -->
  <g transform="translate(340,190)">
    <g clip-path="url(#typeClip)">
      <text x="0" y="45" font-family="ui-monospace, monospace" font-size="26" fill="#C9D1D9">Full-Stack Engineer · React · Next.js · Node.js · NestJS</text>
    </g>
    <rect x="0" y="15" width="3" height="34" fill="#00E5FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scan line -->
  <rect x="-80" y="0" width="80" height="320" fill="#00E5FF" opacity="0.06">
    <animate attributeName="x" values="-80;1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom status -->
  <g font-family="ui-monospace, monospace" font-size="15" fill="#8B949E">
    <circle cx="565" cy="278" r="5" fill="#00FFA3">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="580" y="283">status: available for hire</text>
  </g>
</svg>
