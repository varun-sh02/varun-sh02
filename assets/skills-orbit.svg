<svg width="620" height="620" viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1F2E"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="620" height="620" fill="#05070A"/>

  <g transform="translate(310,310)">

    <!-- orbit guide rings with flowing dash animation -->
    <circle r="90" fill="none" stroke="#153042" stroke-width="1.5" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="165" fill="none" stroke="#1a2a3a" stroke-width="1.5" stroke-dasharray="3 8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="none" stroke="#152230" stroke-width="1.5" stroke-dasharray="2 10">
      <animate attributeName="stroke-dashoffset" values="0;-140" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- ORBIT A: 90px radius, 3 icons, 18s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <g transform="rotate(0) translate(90,0)"><image x="-18" y="-18" width="36" height="36" href="https://skillicons.dev/icons?i=react"/></g>
      <g transform="rotate(120) translate(90,0)"><image x="-18" y="-18" width="36" height="36" href="https://skillicons.dev/icons?i=nextjs"/></g>
      <g transform="rotate(240) translate(90,0)"><image x="-18" y="-18" width="36" height="36" href="https://skillicons.dev/icons?i=ts"/></g>
    </g>

    <!-- ORBIT B: 165px radius, 4 icons, 28s reverse -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <g transform="rotate(30) translate(165,0)"><image x="-17" y="-17" width="34" height="34" href="https://skillicons.dev/icons?i=nodejs"/></g>
      <g transform="rotate(120) translate(165,0)"><image x="-17" y="-17" width="34" height="34" href="https://skillicons.dev/icons?i=nestjs"/></g>
      <g transform="rotate(210) translate(165,0)"><image x="-17" y="-17" width="34" height="34" href="https://skillicons.dev/icons?i=express"/></g>
      <g transform="rotate(300) translate(165,0)"><image x="-17" y="-17" width="34" height="34" href="https://skillicons.dev/icons?i=graphql"/></g>
    </g>

    <!-- ORBIT C: 240px radius, 5 icons, 40s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <g transform="rotate(0) translate(240,0)"><image x="-16" y="-16" width="32" height="32" href="https://skillicons.dev/icons?i=mongodb"/></g>
      <g transform="rotate(72) translate(240,0)"><image x="-16" y="-16" width="32" height="32" href="https://skillicons.dev/icons?i=docker"/></g>
      <g transform="rotate(144) translate(240,0)"><image x="-16" y="-16" width="32" height="32" href="https://skillicons.dev/icons?i=redis"/></g>
      <g transform="rotate(216) translate(240,0)"><image x="-16" y="-16" width="32" height="32" href="https://skillicons.dev/icons?i=firebase"/></g>
      <g transform="rotate(288) translate(240,0)"><image x="-16" y="-16" width="32" height="32" href="https://skillicons.dev/icons?i=git"/></g>
    </g>

    <!-- core -->
    <circle r="62" fill="url(#coreGrad)" stroke="#00E5FF" stroke-width="2" filter="url(#coreGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#00E5FF">VARUN</text>
    <text x="0" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8B949E">FULL-STACK</text>
  </g>

  <text x="310" y="600" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8B949E">the stack, in orbit</text>
</svg>
