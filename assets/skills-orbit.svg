<svg width="620" height="640" viewBox="0 0 620 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1F2E"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="620" height="640" fill="#05070A"/>

  <g transform="translate(310,310)">

    <!-- orbit guide rings with flowing dash animation -->
    <circle r="90" fill="none" stroke="#153042" stroke-width="1.5" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="165" fill="none" stroke="#1a2a3a" stroke-width="1.5" stroke-dasharray="3 8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="none" stroke="#152230" stroke-width="1.5" stroke-dasharray="2 10">
      <animate attributeName="stroke-dashoffset" values="0;-140" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- reusable chip: circle + short label, self-contained (no external refs) -->
    <!-- ORBIT A: 90px radius, 3 chips, 18s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>

      <g transform="rotate(0) translate(90,0)">
        <circle r="19" fill="#0B1F2E" stroke="#61DAFB" stroke-width="1.6"/>
        <text text-anchor="middle" dy="5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#61DAFB">RCT</text>
      </g>
      <g transform="rotate(120) translate(90,0)">
        <circle r="19" fill="#0B1F2E" stroke="#E7E7E7" stroke-width="1.6"/>
        <text text-anchor="middle" dy="5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#E7E7E7">NXT</text>
      </g>
      <g transform="rotate(240) translate(90,0)">
        <circle r="19" fill="#0B1F2E" stroke="#3178C6" stroke-width="1.6"/>
        <text text-anchor="middle" dy="5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#3178C6">TS</text>
      </g>
    </g>

    <!-- ORBIT B: 165px radius, 4 chips, 28s reverse -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>

      <g transform="rotate(30) translate(165,0)">
        <circle r="18" fill="#0B1F2E" stroke="#8CC84B" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#8CC84B">NODE</text>
      </g>
      <g transform="rotate(120) translate(165,0)">
        <circle r="18" fill="#0B1F2E" stroke="#E0234E" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#E0234E">NEST</text>
      </g>
      <g transform="rotate(210) translate(165,0)">
        <circle r="18" fill="#0B1F2E" stroke="#C9D1D9" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#C9D1D9">EXPR</text>
      </g>
      <g transform="rotate(300) translate(165,0)">
        <circle r="18" fill="#0B1F2E" stroke="#E10098" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#E10098">GQL</text>
      </g>
    </g>

    <!-- ORBIT C: 240px radius, 5 chips, 40s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>

      <g transform="rotate(0) translate(240,0)">
        <circle r="17" fill="#0B1F2E" stroke="#47A248" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#47A248">MDB</text>
      </g>
      <g transform="rotate(72) translate(240,0)">
        <circle r="17" fill="#0B1F2E" stroke="#2496ED" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#2496ED">DKR</text>
      </g>
      <g transform="rotate(144) translate(240,0)">
        <circle r="17" fill="#0B1F2E" stroke="#DC382D" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#DC382D">RDS</text>
      </g>
      <g transform="rotate(216) translate(240,0)">
        <circle r="17" fill="#0B1F2E" stroke="#FFCA28" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#FFCA28">FBS</text>
      </g>
      <g transform="rotate(288) translate(240,0)">
        <circle r="17" fill="#0B1F2E" stroke="#F05032" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#F05032">GIT</text>
      </g>
    </g>

    <!-- core -->
    <circle r="62" fill="url(#coreGrad)" stroke="#00E5FF" stroke-width="2" filter="url(#coreGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#00E5FF">VARUN</text>
    <text x="0" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8B949E">FULL-STACK</text>
  </g>

  <text x="310" y="620" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8B949E">the stack, in orbit</text>
</svg>
